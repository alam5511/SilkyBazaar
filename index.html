<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silky Bazaar - Pure Silk Sarees & Designer Suits</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #080808; font-family: 'Montserrat', sans-serif; color: #ffffff; padding-bottom: 30px; }

        #admin-login-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #080808;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .login-box {
            background: linear-gradient(145deg, #141414, #0d0d0d);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }
        .login-title { font-family: 'Cinzel', serif; font-size: 20px; color: #fcf6ba; margin-bottom: 15px; }
        .login-input {
            width: 100%; background: #1a1a1a; border: 1px solid #d4af37; border-radius: 25px;
            padding: 10px 15px; color: #fff; text-align: center; font-size: 14px; margin-bottom: 15px; outline: none;
        }
        .login-btn {
            background: linear-gradient(135deg, #bf953f, #aa771c); color: #000; border: none;
            padding: 10px 20px; border-radius: 25px; font-weight: 700; cursor: pointer; width: 100%;
        }

        header {
            text-align: center; padding: 22px 15px 18px 15px; background: rgba(18, 18, 18, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); position: relative; box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
        }
        .brand-name {
            font-family: 'Cinzel', serif; font-size: 28px; letter-spacing: 4px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-weight: 800;
        }
        .brand-tagline { font-size: 11px; color: #d4af37; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; margin-top: 4px; }
        .gold-divider { height: 1px; width: 80px; background: linear-gradient(90deg, transparent, #d4af37, transparent); margin: 8px auto; }
        .contact-info { font-size: 11px; color: #d1d1d1; letter-spacing: 1px; line-height: 1.6; }
        .contact-info i { color: #d4af37; margin-right: 4px; }
        .phone-link { color: #fcf6ba; text-decoration: none; }

        .search-container { max-width: 420px; margin: 20px auto 0 auto; padding: 0 12px; position: relative; }
        .search-box {
            width: 100%; background: rgba(26, 26, 26, 0.9); border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px; padding: 12px 18px 12px 42px; color: #fff; font-size: 13px; outline: none;
        }
        .search-icon { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); color: #d4af37; font-size: 14px; }

        .reel-container { display: flex; flex-direction: column; align-items: center; gap: 35px; max-width: 420px; margin: 25px auto; padding: 0 12px; }
        .reel-card { background: linear-gradient(145deg, #141414, #0d0d0d); border-radius: 18px; overflow: hidden; width: 100%; border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8); }
        .media-box { width: 100%; aspect-ratio: 9 / 16; overflow: hidden; position: relative; background-color: #1a1a1a; cursor: pointer; }
        .carousel-slide { width: 100%; height: 100%; display: none; position: relative; }
        .carousel-slide.active { display: block; }
        .carousel-slide img, .carousel-slide video { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Halka Soft Watermark (Product Focus) */
        .display-watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg);
            font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; color: rgba(212, 175, 55, 0.18);
            pointer-events: none; z-index: 15; white-space: nowrap; letter-spacing: 3px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .slide-counter { position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.65); color: #fcf6ba; border: 1px solid rgba(212, 175, 55, 0.4); padding: 4px 10px; border-radius: 12px; font-size: 11px; z-index: 20; }
        .fullscreen-btn { position: absolute; top: 12px; left: 12px; background: rgba(0, 0, 0, 0.65); color: #fcf6ba; border: 1px solid rgba(212, 175, 55, 0.4); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 20; }
        .carousel-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 20; }
        .dot { width: 6px; height: 6px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; }
        .dot.active { background: #d4af37; width: 16px; border-radius: 10px; }

        .card-details { padding: 18px 15px; text-align: center; background: #121212; }
        .product-title { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 600; margin-bottom: 14px; color: #fcf6ba; }
        .action-buttons { display: flex; gap: 10px; margin-bottom: 12px; }
        .whatsapp-btn { flex: 2; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; text-decoration: none; padding: 12px 0; border-radius: 8px; font-weight: 600; font-size: 14px; }
        .call-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(212, 175, 55, 0.1); color: #d4af37; border: 1px solid #d4af37; text-decoration: none; padding: 12px 0; border-radius: 8px; font-weight: 600; font-size: 14px; }

        .comment-section { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(212, 175, 55, 0.2); }
        .comment-input { width: 100%; background: #1a1a1a; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none; }
        .comment-btn { background: rgba(212, 175, 55, 0.15); color: #fcf6ba; border: 1px solid #d4af37; padding: 8px 0; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .fullscreen-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.95); z-index: 99999; justify-content: center; align-items: center; }
        .modal-wrapper { position: relative; width: 90%; height: 90%; display: flex; justify-content: center; align-items: center; }
        .modal-wrapper img, .modal-wrapper video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        
        .modal-download-btn {
            position: absolute; top: 15px; right: 15px; background: #d4af37; color: #000;
            width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; z-index: 100000; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.8); border: none;
        }

        .close-btn { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 32px; font-weight: bold; cursor: pointer; z-index: 100000; background: rgba(0,0,0,0.5); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .no-results { text-align: center; color: #888; font-size: 14px; margin-top: 30px; }
        footer { text-align: center; padding: 25px 15px; margin-top: 30px; border-top: 1px solid rgba(212, 175, 55, 0.2); background: #0d0d0d; }
        .footer-brand { font-family: 'Cinzel', serif; font-size: 18px; color: #d4af37; letter-spacing: 2px; margin-bottom: 6px; }
        .footer-text { font-size: 11px; color: #777; }
    </style>
</head>
<body>

    <div id="admin-login-overlay">
        <div class="login-box">
            <div class="login-title">ADMIN ACCESS</div>
            <p style="font-size:12px; color:#aaa; margin-bottom:15px;">Welcome to Silky Bazaar :</p>
            <input type="password" id="adminPass" class="login-input" placeholder="Password daalein...">
            <button onclick="verifyAdmin()" class="login-btn">Login</button>
        </div>
    </div>

    <header>
        <div class="brand-name">Silky Bazaar</div>
        <div class="brand-tagline">Pure Silk Sarees & Designer Suits</div>
        <div class="gold-divider"></div>
        <div class="contact-info">
            <p><i class="fa-solid fa-location-dot"></i> Mubarakpur, Azamgarh, Uttar Pradesh, India - 276404</p>
            <p><i class="fa-solid fa-phone"></i> Mobile: <a href="tel:+916392380133" class="phone-link">+91 6392380133</a></p>
        </div>
    </header>

    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" class="search-box" placeholder="Find(Exmp: Kataan, Tissue, Handloom, Suit...)" onkeyup="filterProducts()">
    </div>

    <div class="reel-container" id="catalog"></div>

    <div class="fullscreen-modal" id="mediaModal">
        <span class="close-btn" onclick="closeFullscreen()">&times;</span>
        <div class="modal-wrapper" id="modalContainer"></div>
    </div>

    <footer>
        <div class="footer-brand">SILKY BAZAAR</div>
        <div class="footer-text">© Mubarakpur Silk Sarees & Suit Collection. All Rights Reserved.</div>
    </footer>

    <script>
        const isApp = navigator.userAgent.includes("SilkyBazaarApp");

        if (!isApp) {
            const isAdminLoggedIn = localStorage.getItem("silky_admin_logged");
            if (isAdminLoggedIn !== "true") {
                document.getElementById("admin-login-overlay").style.display = "flex";
            }
        }

        function verifyAdmin() {
            const pass = document.getElementById("adminPass").value;
            if (pass === "Silky@#8528") {
                localStorage.setItem("silky_admin_logged", "true");
                document.getElementById("admin-login-overlay").style.display = "none";
            } else {
                alert("Wrong password!");
            }
        }

        const phoneNumber = "916392380133";
        const websiteDomain = "https://silkybazaar.in";

        const products = [
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/1.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/1f.jpeg" ] },
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/9.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/8.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/10.png" ] },
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/11.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/11f.jpeg" ] },
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/2.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/3.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/4.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/5.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/2%2C3%2C4%2Cf2.jpeg", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/2%20%2C%203%20%2C%204%20%2C%205%20f.jpeg" ] },
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/13.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/12.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/12%2013f.jpeg" ] },
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/14.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/14%20f.jpeg" ] },
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/6.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/6f.jpeg" ] },
            { name: "Saree Pure Kora Handloom (3 Photos)", src: [ "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/7.png", "https://raw.githubusercontent.com/alam5511/SilkyBazaar/main/7f.jpeg" ] },
            { name: "Saree Collection New Link 1", src: "https://files.catbox.moe/hy1e40.png" },
            { name: "Saree Collection New Link 2", src: "https://files.catbox.moe/7v54gs.png" },
            { name: "Saree Collection New Link 3", src: "https://files.catbox.moe/qilrdk.png" }
        ];

        const catalogContainer = document.getElementById("catalog");

        function renderProducts(items) {
            catalogContainer.innerHTML = "";
            if (items.length === 0) {
                catalogContainer.innerHTML = `<div class="no-results"> This name does not match </div>`;
                return;
            }

            items.forEach((product, cardIdx) => {
                const mediaList = Array.isArray(product.src) ? product.src : [product.src];
                
                const defaultMessage = `Hi Silky Bazaar, I want to order this product:\n\n*Product Name:* ${product.name}\n*Catalog Link:* ${websiteDomain}`;
                const defaultWhatsappLink = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(defaultMessage)}`;

                let slidesHTML = "";
                let dotsHTML = "";

                mediaList.forEach((mediaSrc, mediaIdx) => {
                    const isVideo = mediaSrc.toLowerCase().includes('.mp4');
                    const activeClass = mediaIdx === 0 ? "active" : "";

                    if (isVideo) {
                        slidesHTML += `<div class="carousel-slide ${activeClass}" id="slide-${cardIdx}-${mediaIdx}"><video src="${mediaSrc}" autoplay loop muted playsinline></video></div>`;
                    } else {
                        slidesHTML += `<div class="carousel-slide ${activeClass}" id="slide-${cardIdx}-${mediaIdx}"><img src="${mediaSrc}" alt="${product.name}"></div>`;
                    }
                    dotsHTML += `<div class="dot ${activeClass}" id="dot-${cardIdx}-${mediaIdx}"></div>`;
                });

                let counterHTML = "";
                let expandBtnHTML = "";
                let dotsContainerHTML = "";

                if (mediaList.length > 1) {
                    counterHTML = `<div class="slide-counter" id="counter-${cardIdx}">1 / ${mediaList.length}</div>`;
                    expandBtnHTML = `<div class="fullscreen-btn" title="Full View" onclick="event.stopPropagation(); openFullscreenFromActive(${cardIdx}, '${product.name}')"><i class="fa-solid fa-expand"></i></div>`;
                    dotsContainerHTML = `<div class="carousel-dots">${dotsHTML}</div>`;
                } else {
                    const isVideo = mediaList[0].toLowerCase().includes('.mp4');
                    expandBtnHTML = `<div class="fullscreen-btn" title="Full View" onclick="event.stopPropagation(); openFullscreen('${isVideo ? 'video' : 'image'}', '${mediaList[0]}', '${product.name}')"><i class="fa-solid fa-expand"></i></div>`;
                }

                const productCard = `
                    <div class="reel-card">
                        <div class="media-box" data-current="0" onclick="handleCardClick(${cardIdx}, ${mediaList.length}, '${product.name}')">
                            ${slidesHTML}
                            <div class="display-watermark">SILKY BAZAAR</div>
                            ${expandBtnHTML}
                            ${counterHTML}
                            ${dotsContainerHTML}
                        </div>
                        <div class="card-details">
                            <div class="product-title">${product.name}</div>
                            <div class="action-buttons">
                                <a href="tel:+${phoneNumber}" class="call-btn"><i class="fa-solid fa-phone"></i> Call</a>
                                <a href="${defaultWhatsappLink}" target="_blank" class="whatsapp-btn"><i class="fa-brands fa-whatsapp"></i> Direct Order</a>
                            </div>
                            <div class="comment-section">
                                <input type="text" id="comment-${cardIdx}" class="comment-input" placeholder="कमेंट या सवाल लिखें (उदा: रेट, कलर...)" />
                                <button onclick="sendCustomComment(${cardIdx}, '${product.name}')" class="comment-btn"><i class="fa-paper-plane"></i> Send</button>
                            </div>
                        </div>
                    </div>
                `;
                catalogContainer.innerHTML += productCard;
            });
        }

        function handleCardClick(cardIdx, totalSlides, productName) {
            if (totalSlides > 1) {
                changeSlide(cardIdx, 1, totalSlides);
            } else {
                const mediaBox = document.querySelectorAll('.media-box')[cardIdx];
                const img = mediaBox.querySelector('img');
                const video = mediaBox.querySelector('video');
                if (video) openFullscreen('video', video.getAttribute('src'), productName);
                else if (img) openFullscreen('image', img.getAttribute('src'), productName);
            }
        }

        function changeSlide(cardIdx, direction, totalSlides) {
            const mediaBox = document.querySelectorAll('.media-box')[cardIdx];
            let current = parseInt(mediaBox.getAttribute('data-current'));
            document.getElementById(`slide-${cardIdx}-${current}`).classList.remove('active');
            if (document.getElementById(`dot-${cardIdx}-${current}`)) document.getElementById(`dot-${cardIdx}-${current}`).classList.remove('active');

            current = (current + direction + totalSlides) % totalSlides;
            mediaBox.setAttribute('data-current', current);
            document.getElementById(`slide-${cardIdx}-${current}`).classList.add('active');
            if (document.getElementById(`dot-${cardIdx}-${current}`)) document.getElementById(`dot-${cardIdx}-${current}`).classList.add('active');

            const counterEl = document.getElementById(`counter-${cardIdx}`);
            if (counterEl) counterEl.innerText = `${current + 1} / ${totalSlides}`;
        }

        function openFullscreenFromActive(cardIdx, productName) {
            event.stopPropagation();
            const mediaBox = document.querySelectorAll('.media-box')[cardIdx];
            const current = parseInt(mediaBox.getAttribute('data-current'));
            const activeSlide = document.getElementById(`slide-${cardIdx}-${current}`);
            if (!activeSlide) return;
            const img = activeSlide.querySelector('img');
            const video = activeSlide.querySelector('video');

            if (video) openFullscreen('video', video.getAttribute('src'), productName);
            else if (img) openFullscreen('image', img.getAttribute('src'), productName);
        }

        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered = products.filter(product => product.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function sendCustomComment(index, name) {
            const commentBox = document.getElementById(`comment-${index}`);
            const userComment = commentBox.value.trim();
            let message = `Hi Silky Bazaar,\n\n*Product Name:* ${name}\n*Catalog Link:* ${websiteDomain}`;
            if (userComment !== "") message += `\n\n*Comment On this Product:* ${userComment}`;
            
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // Image par Watermark Stamp karke Download karne ka function
        async function downloadMediaWithWatermark(url) {
            try {
                const isVideo = url.toLowerCase().includes('.mp4');
                if (isVideo) {
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = 'silky-bazaar-video.mp4';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(blobUrl);
                    return;
                }

                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = url;

                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;

                    // 1. Original Image Render
                    ctx.drawImage(img, 0, 0);

                    // 2. Soft & Elegant Gold Watermark Stamp
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.rotate(-25 * Math.PI / 180);

                    const fontSize = Math.floor(canvas.width * 0.055);
                    ctx.font = `bold ${fontSize}px Cinzel, Montserrat, sans-serif`;
                    ctx.fillStyle = "rgba(212, 175, 55, 0.22)"; // Halka Gold Shade
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    
                    ctx.fillText("SILKY BAZAAR", 0, 0);
                    ctx.restore();

                    // 3. Direct Gallery Save Trigger
                    const dataUrl = canvas.toDataURL("image/png");
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = `silky-bazaar-${Date.now()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
            } catch (err) {
                window.open(url, '_blank');
            }
        }

        function openFullscreen(type, mediaSrc, mediaTitle) {
            const modal = document.getElementById("mediaModal");
            const container = document.getElementById("modalContainer");

            let downloadButtonHTML = "";
            if (!isApp) {
                downloadButtonHTML = `
                    <button onclick="downloadMediaWithWatermark('${mediaSrc}')" class="modal-download-btn" title="Watermark ke saath save karein">
                        <i class="fa-solid fa-download"></i>
                    </button>
                `;
            }

            if (type === 'video') {
                container.innerHTML = `
                    ${downloadButtonHTML}
                    <video src="${mediaSrc}" controls autoplay style="max-width:100%; max-height:100%; object-fit:contain; border-radius:8px;"></video>
                `;
            } else {
                container.innerHTML = `
                    ${downloadButtonHTML}
                    <img src="${mediaSrc}" alt="Full View" style="max-width:100%; max-height:100%; object-fit:contain; border-radius:8px;">
                `;
            }
            modal.style.display = "flex";
        }

        function closeFullscreen() {
            document.getElementById("mediaModal").style.display = "none";
            document.getElementById("modalContainer").innerHTML = "";
        }

        renderProducts(products);
    </script>
</body>
</html>
