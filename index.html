<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silky Bazaar - Pure Silk Sarees & Designer Suits</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            padding-bottom: 30px;
        }

        /* Top Bar Styling for Auth */
        .top-user-bar {
            background: #111;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 12px;
        }

        .user-status {
            color: #fcf6ba;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .auth-action-btn {
            background: linear-gradient(135deg, #bf953f, #b38728);
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 18px 15px 18px 15px;
            background: rgba(18, 18, 18, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 800;
        }

        .brand-tagline {
            font-size: 11px;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 4px;
        }

        .gold-divider {
            height: 1px;
            width: 80px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 8px auto;
        }

        .contact-info {
            font-size: 11px;
            color: #d1d1d1;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .contact-info i {
            color: #d4af37;
            margin-right: 4px;
        }

        .phone-link {
            color: #fcf6ba;
            text-decoration: none;
        }

        /* Search Section Styling */
        .search-container {
            max-width: 420px;
            margin: 20px auto 0 auto;
            padding: 0 12px;
            position: relative;
        }

        .search-box {
            width: 100%;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px;
            padding: 12px 18px 12px 42px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #fcf6ba;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .search-icon {
            position: absolute;
            left: 28px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 14px;
        }

        /* Single Column Layout */
        .reel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            max-width: 420px;
            margin: 25px auto;
            padding: 0 12px;
        }

        .reel-card {
            background: linear-gradient(145deg, #141414, #0d0d0d);
            border-radius: 18px;
            overflow: hidden;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
        }

        .media-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            position: relative;
            background-color: #1a1a1a;
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
            cursor: pointer;
        }

        .carousel-slide.active {
            display: block;
        }

        .carousel-slide img, .carousel-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .display-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.28);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            z-index: 15;
            white-space: nowrap;
            letter-spacing: 3px;
            user-select: none;
        }

        .slide-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #fcf6ba;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .fullscreen-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #fcf6ba;
            border: 1px solid rgba(212, 175, 55, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 20;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #d4af37;
            width: 16px;
            border-radius: 10px;
        }

        .card-details {
            padding: 18px 15px;
            text-align: center;
            background: #121212;
        }

        .product-title {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #fcf6ba;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .whatsapp-btn {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .call-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid #d4af37;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .comment-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(212, 175, 55, 0.2);
        }

        .comment-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            outline: none;
        }

        .comment-btn {
            background: rgba(212, 175, 55, 0.15);
            color: #fcf6ba;
            border: 1px solid #d4af37;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Fullscreen Modal */
        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-wrapper {
            position: relative;
            max-width: 95%;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-wrapper img, .modal-wrapper video {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal-download-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(212, 175, 55, 0.9);
            color: #000;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            z-index: 2010;
            cursor: pointer;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2001;
        }

        /* Auth Login Modal Popup */
        .auth-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .auth-box {
            background: #141414;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 25px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            position: relative;
        }

        .auth-title {
            font-family: 'Cinzel', serif;
            color: #fcf6ba;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .auth-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .auth-submit-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .auth-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            margin-top: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            background: #0d0d0d;
        }

        .footer-brand {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: #d4af37;
            margin-bottom: 6px;
        }

        .footer-text {
            font-size: 11px;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Top User Navigation Bar -->
    <div class="top-user-bar">
        <div class="user-status" id="userStatusText">
            <i class="fa-regular fa-user"></i> Guest User
        </div>
        <button class="auth-action-btn" id="authBtn" onclick="handleAuthClick()">Sign In / Sign Up</button>

    <header>

        <div class="brand-tagline">Pure Silk Sarees & Designer Suits</div>
        <div class="gold-divider"></div>
        <div class="contact-info">
            <p><i class="fa-solid fa-location-dot"></i> Mubarakpur, Azamgarh, Uttar Pradesh, India - 276404</p>
            <p><i class="fa-solid fa-phone"></i> Mobile: <a href="tel:+916392380133" class="phone-link">+91 6392380133</a></p>
        </div>
    </header>

    <!-- Search Section -->
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" class="search-box" placeholder="खोजें (जैसे: Kataan, Tissue, Handloom, Suit...)" onkeyup="filterProducts()">
    </div>

    <!-- Product Catalog -->
    <div class="reel-container" id="catalog"></div>

    <!-- Fullscreen Modal View -->
    <div class="fullscreen-modal" id="mediaModal">
        <span class="close-btn" onclick="closeFullscreen()">&times;</span>
        <div class="modal-wrapper" id="modalContainer"></div>
    </div>

    <!-- Login/OTP Popup Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-box">
            <span class="auth-close" onclick="closeAuthModal()">&times;</span>
            <div class="auth-title">Mobile Login / Sign Up</div>
            
            <div id="phoneStep">
                <input type="tel" id="phoneNumberInput" class="auth-input" placeholder="+91 9876543210" value="+91">
                <div id="recaptcha-container" style="margin-bottom: 10px;"></div>
                <button class="auth-submit-btn" onclick="sendOTP()">Send OTP</button>
            </div>

            <div id="otpStep" style="display: none;">
                <input type="text" id="otpInput" class="auth-input" placeholder="6-digit OTP enter karein">
                <button class="auth-submit-btn" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <div class="footer-brand">SILKY BAZAAR</div>
        <div class="footer-text">© Mubarakpur Silk Sarees & Suit Collection. All Rights Reserved.</div>
    </footer>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAeWe9ABOG5ylXLtGXdprNpkXa4EFDhUtY",
            authDomain: "silkybazaar.firebaseapp.com",
            projectId: "silkybazaar",
            storageBucket: "silkybazaar.firebasestorage.app",
            messagingSenderId: "609277865689",
            appId: "1:609277865689:web:e862049683334b12c898c8",
            measurementId: "G-BM615HVRNJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let confirmationResultObj = null;

        window.initRecaptcha = function() {
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'invisible'
                });
            }
        };

        window.sendOTP = function() {
            const phoneNumber = document.getElementById('phoneNumberInput').value.trim();
            if (phoneNumber.length < 10) {
                alert("Kripya sahi mobile number enter karein!");
                return;
            }

            window.initRecaptcha();
            const appVerifier = window.recaptchaVerifier;

            signInWithPhoneNumber(auth, phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    confirmationResultObj = confirmationResult;
                    document.getElementById('phoneStep').style.display = 'none';
                    document.getElementById('otpStep').style.display = 'block';
                    alert("OTP aapke mobile number par bhej diya gaya hai!");
                }).catch((error) => {
                    alert("Error: " + error.message);
                });
        };

        window.verifyOTP = function() {
            const otp = document.getElementById('otpInput').value.trim();
            if (otp.length !== 6) {
                alert("6 digit OTP enter karein");
                return;
            }

            confirmationResultObj.confirm(otp).then((result) => {
                closeAuthModal();
                alert("Login Successful!");
            }).catch((error) => {
                alert("Galat OTP! Phir se try karein.");
            });
        };

        onAuthStateChanged(auth, (user) => {
            const userStatusText = document.getElementById('userStatusText');
            const authBtn = document.getElementById('authBtn');

            if (user) {
                userStatusText.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#25D366;"></i> ${user.phoneNumber}`;
                authBtn.innerText = "Logout";
                authBtn.onclick = function() {
                    signOut(auth).then(() => {
                        alert("Logout ho gaya!");
                    });
                };
            } else {
                userStatusText.innerHTML = `<i class="fa-regular fa-user"></i> Guest User`;
                authBtn.innerText = "Sign In / Sign Up";
                authBtn.onclick = function() {
                    openAuthModal();
                };
            }
        });
    </script>

    <script>
        const phoneNumber = "916392380133";

        const products = [
            { 
                name: "Saree Pure Kora Handloom (3 Photos)", 
                src: [
                    "https://files.catbox.moe/ybgbzl.jpeg",
                    "https://files.catbox.moe/ad78dq.png",
                    "https://files.catbox.moe/kmdkkp.jpeg"
                ] 
            },
            { 
                name: "Flat Saree Pure Kora Handloom-1001 (2 Photos)", 
                src: [
                    "https://files.catbox.moe/be9i6q.png",
                    "https://files.catbox.moe/23ivqm.jpg"
                ] 
            },
            { name: "Banarasi Pure Saree 01", src: "https://files.catbox.moe/zsv63n.jpeg" },
            { name: "Pure Tissue Banarasi Saree Reel", src: "https://files.catbox.moe/qp3e7t.mp4" },
            { name: "Saree Collection New Link 1", src: "https://files.catbox.moe/hy1e40.png" },
            { name: "Saree Collection New Link 2", src: "https://files.catbox.moe/7v54gs.png" },
            { name: "Saree Collection New Link 3", src: "https://files.catbox.moe/qilrdk.png" }
        ];

        const catalogContainer = document.getElementById("catalog");

        function renderProducts(items) {
            catalogContainer.innerHTML = "";

            if (items.length === 0) {
                catalogContainer.innerHTML = `<div style="text-align:center; color:#888;">Koi product nahi mila.</div>`;
                return;
            }

            items.forEach((product, cardIdx) => {
                const mediaList = Array.isArray(product.src) ? product.src : [product.src];
                const defaultMessage = `Hi Silky Bazaar, mujhe ye product order karna hai:\n\n*Product Name:* ${product.name}\n*Media Link:* ${mediaList[0]}`;
                const defaultWhatsappLink = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(defaultMessage)}`;

                let slidesHTML = "";
                let dotsHTML = "";

                mediaList.forEach((mediaSrc, mediaIdx) => {
                    const isVideo = mediaSrc.toLowerCase().includes('.mp4');
                    const activeClass = mediaIdx === 0 ? "active" : "";
                    const clickAction = mediaList.length > 1 ? `changeSlide(${cardIdx}, 1, ${mediaList.length})` : `openFullscreen('${isVideo ? 'video' : 'image'}', '${mediaSrc}', '${product.name}')`;

                    if (isVideo) {
                        slidesHTML += `
                            <div class="carousel-slide ${activeClass}" id="slide-${cardIdx}-${mediaIdx}" onclick="${clickAction}">
                                <video src="${mediaSrc}" autoplay loop muted playsinline></video>
                            </div>
                        `;
                    } else {
                        slidesHTML += `
                            <div class="carousel-slide ${activeClass}" id="slide-${cardIdx}-${mediaIdx}" onclick="${clickAction}">
                                <img src="${mediaSrc}" alt="${product.name}">
                            </div>
                        `;
                    }

                    dotsHTML += `<div class="dot ${activeClass}" id="dot-${cardIdx}-${mediaIdx}"></div>`;
                });

                let counterHTML = mediaList.length > 1 ? `<div class="slide-counter" id="counter-${cardIdx}">1 / ${mediaList.length}</div>` : "";
                let expandBtnHTML = `<div class="fullscreen-btn" title="Full View" onclick="event.stopPropagation(); openFullscreenFromActive(${cardIdx}, '${product.name}')"><i class="fa-solid fa-expand"></i></div>`;
                let dotsContainerHTML = mediaList.length > 1 ? `<div class="carousel-dots">${dotsHTML}</div>` : "";

                const productCard = `
                    <div class="reel-card">
                        <div class="media-box" data-current="0">
                            ${slidesHTML}
                            <div class="display-watermark">SILKY BAZAAR</div>
                            ${expandBtnHTML}
                            ${counterHTML}
                            ${dotsContainerHTML}
                        </div>
                        <div class="card-details">
                            <div class="product-title">${product.name}</div>
                            <div class="action-buttons">
                                <a href="tel:+${phoneNumber}" class="call-btn"><i class="fa-solid fa-phone"></i> Call</a>
                                <a href="${defaultWhatsappLink}" target="_blank" class="whatsapp-btn"><i class="fa-brands fa-whatsapp"></i> Direct Order</a>
                            </div>
                            <div class="comment-section">
                                <input type="text" id="comment-${cardIdx}" class="comment-input" placeholder="कमेंट या सवाल लिखें..." />
                                <button onclick="sendCustomComment(${cardIdx}, '${product.name}', '${mediaList[0]}')" class="comment-btn"><i class="fa-paper-plane"></i> Send</button>
                            </div>
                        </div>
                    </div>
                `;

                catalogContainer.innerHTML += productCard;
            });
        }

        function changeSlide(cardIdx, direction, totalSlides) {
            event.stopPropagation();
            const mediaBox = document.querySelectorAll('.media-box')[cardIdx];
            let current = parseInt(mediaBox.getAttribute('data-current'));

            document.getElementById(`slide-${cardIdx}-${current}`).classList.remove('active');
            if (document.getElementById(`dot-${cardIdx}-${current}`)) {
                document.getElementById(`dot-${cardIdx}-${current}`).classList.remove('active');
            }

            current = (current + direction + totalSlides) % totalSlides;
            mediaBox.setAttribute('data-current', current);

            document.getElementById(`slide-${cardIdx}-${current}`).classList.add('active');
            if (document.getElementById(`dot-${cardIdx}-${current}`)) {
                document.getElementById(`dot-${cardIdx}-${current}`).classList.add('active');
            }

            const counterEl = document.getElementById(`counter-${cardIdx}`);
            if (counterEl) {
                counterEl.innerText = `${current + 1} / ${totalSlides}`;
            }
        }

        function openFullscreenFromActive(cardIdx, productName) {
            const mediaBox = document.querySelectorAll('.media-box')[cardIdx];
            const current = parseInt(mediaBox.getAttribute('data-current'));
            const activeSlide = document.getElementById(`slide-${cardIdx}-${current}`);
            const img = activeSlide.querySelector('img');
            const video = activeSlide.querySelector('video');

            if (video) openFullscreen('video', video.getAttribute('src'), productName);
            else if (img) openFullscreen('image', img.getAttribute('src'), productName);
        }

        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered = products.filter(product => product.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function sendCustomComment(index, name, mediaInfo) {
            const commentBox = document.getElementById(`comment-${index}`);
            const userComment = commentBox.value.trim();
            let message = `Hi Silky Bazaar,\n\n*Product Name:* ${name}\n*Media Link:* ${mediaInfo}`;
            if (userComment !== "") message += `\n\n*मेरा सवाल/कमेंट:* ${userComment}`;
            window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function openFullscreen(type, mediaSrc, mediaTitle) {
            const modal = document.getElementById("mediaModal");
            const container = document.getElementById("modalContainer");
            if(type === 'video') {
                container.innerHTML = `<video src="${mediaSrc}" controls autoplay style="max-width:100%; max-height:90vh; border-radius:8px;"></video>`;
            } else {
                container.innerHTML = `<img src="${mediaSrc}" alt="Full View">`;
            }
            modal.style.display = "flex";
        }

        function closeFullscreen() {
            document.getElementById("mediaModal").style.display = "none";
        }

        function openAuthModal() {
            document.getElementById("authModal").style.display = "flex";
            document.getElementById('phoneStep').style.display = 'block';
            document.getElementById('otpStep').style.display = 'none';
        }

        function closeAuthModal() {
            document.getElementById("authModal").style.display = "none";
        }

        renderProducts(products);
    </script>
</body>
</html>
