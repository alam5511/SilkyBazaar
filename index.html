<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silky Bazaar - Pure Silk Sarees & Designer Suits</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080808;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            padding-bottom: 30px;
        }

        /* Top User Bar Styling */
        .top-user-bar {
            background: #111;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 12px;
        }

        .user-status {
            color: #fcf6ba;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
        }

        .google-login-btn {
            background: #ffffff;
            color: #333;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }

        .google-login-btn:hover {
            background: #f1f1f1;
        }

        .logout-btn {
            background: rgba(212, 175, 55, 0.2);
            color: #fcf6ba;
            border: 1px solid #d4af37;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 18px 15px 18px 15px;
            background: rgba(18, 18, 18, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 800;
        }

        .brand-tagline {
            font-size: 11px;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 4px;
        }

        .gold-divider {
            height: 1px;
            width: 80px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 8px auto;
        }

        .contact-info {
            font-size: 11px;
            color: #d1d1d1;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .contact-info i {
            color: #d4af37;
            margin-right: 4px;
        }

        .phone-link {
            color: #fcf6ba;
            text-decoration: none;
        }

        /* Search Section Styling */
        .search-container {
            max-width: 420px;
            margin: 20px auto 0 auto;
            padding: 0 12px;
            position: relative;
        }

        .search-box {
            width: 100%;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px;
            padding: 12px 18px 12px 42px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #fcf6ba;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        .search-icon {
            position: absolute;
            left: 28px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 14px;
        }

        /* Single Column Layout */
        .reel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            max-width: 420px;
            margin: 25px auto;
            padding: 0 12px;
        }

        .reel-card {
            background: linear-gradient(145deg, #141414, #0d0d0d);
            border-radius: 18px;
            overflow: hidden;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
        }

        .media-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            position: relative;
            background-color: #1a1a1a;
        }

        .carousel-slide {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
            cursor: pointer;
        }

        .carousel-slide.active {
            display: block;
        }

        .carousel-slide img, .carousel-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .display-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.28);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            z-index: 15;
            white-space: nowrap;
            letter-spacing: 3px;
            user-select: none;
        }

        .slide-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #fcf6ba;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .fullscreen-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #fcf6ba;
            border: 1px solid rgba(212, 175, 55, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 20;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #d4af37;
            width: 16px;
            border-radius: 10px;
        }

        .card-details {
            padding: 18px 15px;
            text-align: center;
            background: #121212;
        }

        .product-title {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #fcf6ba;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .whatsapp-btn {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #fff;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .call-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid #d4af37;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .comment-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(212, 175, 55, 0.2);
        }

        .comment-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
